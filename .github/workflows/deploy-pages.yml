# Build the static app and deploy it to GitHub Pages on every push to main.
#
# The public base path is derived from the repository name (…github.io/<repo>/),
# so nothing here is hard-coded — fork or rename the repo and it still works. The
# same source builds for root hosting (Docker / custom domain) by simply not
# setting PUBLIC_BASE_PATH; see vite.config.ts.
#
# Enable once in the repo: Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build (base derived from repo name)
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
